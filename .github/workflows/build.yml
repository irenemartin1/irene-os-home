name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      # keep the same debug signing key between builds (stored in GitHub's private cache, not in the repo)
      # so new versions install right over the old one
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: irene-os-debug-keystore-v1
      - run: gradle assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Irene OS (latest build)
          files: app/build/outputs/apk/debug/app-debug.apk
