<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Irene OS">
<link rel="apple-touch-icon" id="touchicon" href="">
<link rel="manifest" href="manifest.json">
<title>Irene OS Home</title>
<style>
  :root { --fg:#fff; --soft:rgba(255,255,255,.7); --accent:#c9a0ff; --card:rgba(30,20,50,.55); --line:rgba(255,255,255,.18); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#120a24; color:var(--fg);
    font-family: -apple-system, "SF Pro Rounded", "Helvetica Neue", sans-serif; -webkit-user-select:none; user-select:none; touch-action: manipulation; }
  #bg { position:fixed; inset:0; z-index:0; }
  #home { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column;
    padding: calc(env(safe-area-inset-top) + 22px) 0 calc(env(safe-area-inset-bottom) + 14px); transition: opacity .25s, transform .25s; }
  #note { margin: 0 auto 18px; width: min(560px, 84vw); min-height: 64px; max-height: 180px; overflow:auto; padding: 14px 18px; border-radius: 22px;
    background: var(--card); border: 1px solid var(--line); color: var(--fg); font-size: 18px; line-height: 1.35; outline: none; resize:none;
    -webkit-user-select:text; user-select:text; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); font-family: inherit; }
  #note::placeholder { color: var(--soft); }
  #pages { flex:1; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  #pages::-webkit-scrollbar { display:none; }
  .page { flex:0 0 100%; scroll-snap-align:start; display:grid; align-content:start; justify-content:center; padding: 6px 4vw; gap: 18px 10px; }
  .app { width: var(--cell); display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; }
  .app canvas { width: var(--icon); height: var(--icon); filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); transition: transform .12s; }
  .app:active canvas { transform: scale(.9); }
  .app span { font-size: 13px; color: var(--fg); text-shadow: 0 1px 3px rgba(0,0,0,.35); max-width: 100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .light .app span { text-shadow: 0 1px 2px rgba(255,255,255,.6); }
  #dots { display:flex; justify-content:center; gap:8px; margin: 6px 0 8px; }
  #dots i { width:7px; height:7px; border-radius:50%; background: var(--soft); opacity:.45; }
  #dots i.on { opacity:1; background: var(--accent); }
  #hint { text-align:center; font-size:13px; color: var(--soft); margin-bottom:8px; }
  #dock { margin: 0 auto; display:flex; gap: 22px; padding: 12px 22px; border-radius: 30px; background: var(--card); border:1px solid var(--line);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  #dock .app span { display:none; }
  #drawer { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; padding: calc(env(safe-area-inset-top) + 20px) 0 20px;
    transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  #drawer.open { transform: translateY(0); }
  #drawer .sheetbg { position:absolute; inset:0; background: var(--drawer); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); z-index:-1; }
  #search { margin: 0 auto 18px; width:min(560px,84vw); padding: 14px 20px; border-radius: 22px; border:1px solid var(--line); background: var(--card); color: var(--fg); font-size: 17px; outline:none; -webkit-user-select:text; user-select:text; }
  #search::placeholder { color: var(--soft); }
  #all { flex:1; overflow-y:auto; display:grid; justify-content:center; align-content:start; gap: 18px 10px; padding: 0 4vw 40px; -webkit-overflow-scrolling:touch; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:10; max-height: 86vh; overflow-y:auto; padding: 18px 20px calc(env(safe-area-inset-bottom) + 24px);
    border-radius: 26px 26px 0 0; background: var(--sheet); color: var(--sheetfg); transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); -webkit-overflow-scrolling:touch; }
  .sheet.open { transform: translateY(0); }
  .scrim { position:fixed; inset:0; z-index:9; background: rgba(0,0,0,.35); opacity:0; pointer-events:none; transition: opacity .25s; }
  .scrim.open { opacity:1; pointer-events:auto; }
  .sheet h2 { margin: 4px 0 12px; font-size: 21px; }
  .sheet h3 { margin: 22px 0 8px; font-size: 15px; opacity:.7; font-weight:600; text-transform: lowercase; }
  .sheet p { margin: 6px 0; font-size: 15px; line-height:1.45; opacity:.85; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: currentColor; opacity:.25; margin: 0 auto 12px; }
  .btn { display:block; width:100%; text-align:left; padding: 14px 16px; margin: 8px 0; border:0; border-radius: 16px; font-size: 16px; color: inherit; background: var(--btn); font-family: inherit; }
  .btn.main { background: var(--accent); color: var(--onaccent); font-weight:600; text-align:center; }
  .themes { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .chip { border-radius: 18px; padding: 10px; border: 2px solid transparent; font-size: 14px; line-height:1.2; min-height: 92px; display:flex; flex-direction:column; justify-content:flex-end; position:relative; overflow:hidden; }
  .chip.on { border-color: var(--accent); }
  .chip b { font-size: 15px; } .chip small { opacity:.75; margin-top:2px; }
  .chip .em { position:absolute; top:6px; right:8px; font-size: 26px; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  input.field { width:100%; padding: 13px 14px; border-radius: 14px; border:1px solid rgba(128,128,128,.35); background: transparent; color: inherit; font-size: 16px; margin: 6px 0; -webkit-user-select:text; user-select:text; }
  .catalog { display:grid; grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap: 10px; }
  .catalog .app { width:auto; padding: 8px 4px; border-radius: 16px; }
  .catalog .app.on { background: var(--btn); outline: 2px solid var(--accent); }
  .catalog .app span { color: inherit; text-shadow:none; font-size: 12px; }
  .icons { display:grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap: 12px; }
  .icons figure { margin:0; text-align:center; font-size: 12px; } .icons img { width: 100%; border-radius: 22%; }
  #wp img { width:100%; border-radius: 16px; }
  #toast { position:fixed; left:50%; top: calc(env(safe-area-inset-top) + 16px); transform: translate(-50%, -140%); z-index:20; padding: 12px 22px; border-radius: 22px;
    background: var(--sheet); color: var(--sheetfg); font-size: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.2); transition: transform .3s; }
  #toast.show { transform: translate(-50%, 0); }
  .wiggle canvas { animation: wig .28s infinite alternate; } @keyframes wig { from { transform: rotate(-3deg);} to { transform: rotate(3deg);} }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="home">
  <textarea id="note" rows="2" placeholder="tap to write your note ✧"></textarea>
  <div id="pages"></div>
  <div id="dots"></div>
  <div id="hint">swipe up for all apps</div>
  <div id="dock"></div>
</div>

<div id="drawer"><div class="sheetbg"></div>
  <input id="search" placeholder="search" autocomplete="off" autocorrect="off">
  <div id="all"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script src="themes.js"></script>
<script src="scene.js"></script>
<script src="creatures.js"></script>
<script src="app.js"></script>
</body>
</html>
